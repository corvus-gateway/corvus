<!doctype html>
<!-- Source of website/en/assets/social.png (1200x630), the link-preview image.
     Re-render from the repository root:
     chrome --headless --hide-scrollbars --window-size=1200,630 --screenshot=website/en/assets/social.png website/tools/social-card.html -->
<html lang="en">
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: radial-gradient(circle at 15% 20%, #1c2533 0, #0b0e13 60%);
    color: #f2f4f7; font-family: "Segoe UI", system-ui, sans-serif; position: relative;
  }
  .text { position: absolute; left: 72px; top: 80px; width: 560px; }
  .logo { width: 132px; }
  h1 { font-size: 76px; margin: 28px 0 8px; letter-spacing: -1px; }
  .tag { font-size: 34px; color: #c9d1dc; line-height: 1.3; margin: 0 0 30px; }
  .feat { font-size: 23px; color: #8fb4ff; line-height: 1.6; }
  .url { position: absolute; left: 72px; bottom: 56px; font-size: 24px; color: #8a94a3; }
  .shot {
    position: absolute; left: 680px; top: 96px; width: 760px; border-radius: 14px;
    border: 1px solid #2b3442; box-shadow: 0 24px 60px rgba(0,0,0,.55);
  }
</style>
<body>
  <div class="text">
    <img class="logo" src="../en/assets/logo.svg" alt="">
    <h1>Corvus AWPG</h1>
    <p class="tag">Self-hosted web gateway with built&#8209;in protection</p>
    <div class="feat">Reverse proxy &amp; free SSL · WAF rules · Auto-bans<br>Traffic monitor · Access queue</div>
  </div>
  <img class="shot" src="../en/img/dashboard.png" alt="">
  <div class="url">corvusgateway.org</div>
</body>
</html>
