# English documentation. The Korean site (mkdocs.ko.yml) inherits this file.
# Build both: website/build.sh  ·  preview: mkdocs serve -f website/mkdocs.yml
site_name: Corvus AWPG
site_description: Open-source, self-hosted reverse proxy with a built-in WAF, automatic bans, monitoring and an access queue.
site_url: https://corvusgateway.org/
repo_url: https://github.com/corvus-gateway/corvus
repo_name: corvus-gateway/corvus
edit_uri: edit/main/website/en/
copyright: Copyright &copy; 2026 Jikwang Moon · Apache License 2.0
docs_dir: en
site_dir: ../site

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font: false            # system fonts; no requests to Google Fonts
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: blue
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

extra:
  generator: false
  origin: https://corvusgateway.org   # absolute links for hreflang and link previews
  tagline: Self-hosted web gateway with protection, monitoring and an access queue
  alternate:
    - name: English
      link: /
      lang: en
    - name: 한국어
      link: /ko/
      lang: ko
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/corvus-gateway/corvus
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@CorvusGateway
    - icon: fontawesome/brands/mastodon
      link: https://mastodon.social/@moonjikwang
      name: Mastodon
      rel_me: true   # Mastodon profile verification (<link rel="me"> in every page head)

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

hooks:
  - hooks/seo.py   # JSON-LD on every page, llms.txt and llms-full.txt

validation:
  links:
    absolute_links: relative_to_docs
    anchors: warn

nav:
  - Home: index.md
  - Getting started:
      - How Corvus works: getting-started/how-it-works.md
      - Install: getting-started/install.md
      - Install on a NAS: getting-started/nas.md
      - First proxy host: getting-started/first-host.md
      - Migrate from NPM: getting-started/migrate-npm.md
      - Upgrade: getting-started/upgrade.md
  - Proxy:
      - Proxy hosts: proxy/proxy-hosts.md
      - Custom locations: proxy/locations.md
      - Certificates: proxy/certificates.md
      - Redirection hosts: proxy/redirection-hosts.md
      - Streams (TCP/UDP): proxy/streams.md
  - Security:
      - How protection works: security/index.md
      - Security rules: security/rules.md
      - IP lists: security/ip-lists.md
      - Challenge & under attack: security/challenge.md
      - Bans & rate limits: security/bans.md
  - Access queue: access-queue.md
  - Guides:
      - Securing self-hosted services: guides/secure-self-hosted.md
      - Blocking bots and scanners: guides/block-bots.md
      - Traffic floods and DDoS: guides/ddos.md
      - A WAF for Nginx Proxy Manager: guides/waf-for-npm.md
  - Compare:
      - Overview: compare/index.md
      - vs Nginx Proxy Manager: getting-started/compare-npm.md
      - vs NPMplus: compare/npmplus.md
      - vs Caddy: compare/caddy.md
      - vs Traefik: compare/traefik.md
      - vs Zoraxy: compare/zoraxy.md
      - vs BunkerWeb: compare/bunkerweb.md
      - vs SafeLine: compare/safeline.md
      - and CrowdSec: compare/crowdsec.md
      - vs Pangolin: compare/pangolin.md
  - Operations:
      - Traffic monitor: operations/traffic.md
      - Alerts: operations/alerts.md
      - Backup & restore: operations/backup.md
      - Users & sign-in: operations/users.md
      - Block & error pages: operations/pages.md
  - Reference:
      - Configuration: reference/configuration.md
      - Hardened install: reference/hardened.md
      - HTTP API: reference/api.md
      - Performance: reference/performance.md
      - Troubleshooting: reference/troubleshooting.md
      - FAQ: faq.md
