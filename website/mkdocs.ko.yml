# Korean documentation — same settings as mkdocs.yml, Korean pages in ko/.
INHERIT: mkdocs.yml
docs_dir: ko
site_dir: ../site/ko/docs
edit_uri: edit/main/website/ko/
site_url: https://corvusgateway.org/ko/docs/
site_description: 웹 방화벽(WAF), 자동 차단, 관제, 접속 대기열을 갖춘 오픈소스 셀프 호스팅 리버스 프록시. 프록시 호스트와 무료 SSL을 몇 번의 클릭으로 설정합니다.
extra:
  homepage: https://corvusgateway.org/   # the homepage is English only
  tagline: 보호·관제·접속 대기열을 갖춘 셀프 호스팅 웹 게이트웨이
  docs_title: 문서
theme:
  language: ko
nav:
  - 문서 홈: index.md
  - 시작하기:
      - 동작 방식: getting-started/how-it-works.md
      - 설치: getting-started/install.md
      - NAS에 설치: getting-started/nas.md
      - 첫 프록시 호스트: getting-started/first-host.md
      - NPM에서 이전: getting-started/migrate-npm.md
      - 업그레이드: getting-started/upgrade.md
  - 프록시:
      - 프록시 호스트: proxy/proxy-hosts.md
      - 사용자 지정 위치: proxy/locations.md
      - 인증서: proxy/certificates.md
      - 리디렉션 호스트: proxy/redirection-hosts.md
      - 스트림 (TCP/UDP): proxy/streams.md
  - 보안:
      - 보호 동작 방식: security/index.md
      - 보안 규칙: security/rules.md
      - IP 목록: security/ip-lists.md
      - 챌린지와 공격 대응 모드: security/challenge.md
      - 차단과 Rate Limit: security/bans.md
  - 접속 대기열: access-queue.md
  - 가이드:
      - 셀프 호스팅 서비스 보안: guides/secure-self-hosted.md
      - 봇과 스캐너 차단: guides/block-bots.md
      - 트래픽 폭주와 DDoS: guides/ddos.md
      - Nginx Proxy Manager용 WAF: guides/waf-for-npm.md
  - 비교:
      - 개요: compare/index.md
      - Nginx Proxy Manager와 비교: getting-started/compare-npm.md
      - NPMplus와 비교: compare/npmplus.md
      - Caddy와 비교: compare/caddy.md
      - Traefik과 비교: compare/traefik.md
      - Zoraxy와 비교: compare/zoraxy.md
      - BunkerWeb과 비교: compare/bunkerweb.md
      - SafeLine과 비교: compare/safeline.md
      - CrowdSec과 함께: compare/crowdsec.md
      - Pangolin과 비교: compare/pangolin.md
  - 운영:
      - 트래픽 관제: operations/traffic.md
      - 알림: operations/alerts.md
      - 백업과 복원: operations/backup.md
      - 사용자와 로그인: operations/users.md
      - 차단·오류 페이지: operations/pages.md
  - 참고:
      - 환경 변수: reference/configuration.md
      - 강화 설치: reference/hardened.md
      - HTTP API: reference/api.md
      - 성능: reference/performance.md
      - 문제 해결: reference/troubleshooting.md
      - 자주 묻는 질문: faq.md
