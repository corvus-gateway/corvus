# Build + tests + dependency vulnerability checks on every push / pull request.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: { go-version-file: go.mod }
      - run: mkdir -p control/internal/webui/dist && touch control/internal/webui/dist/.gitkeep
      - name: gofmt (unformatted files fail the build)
        run: test -z "$(gofmt -l control | tee /dev/stderr)"
      - run: go vet ./...
      - name: Tests (race detector, statement coverage of the control plane)
        run: go test -race -coverpkg=./control/... -coverprofile=cover.out ./...
      - name: Coverage must stay at 80% or more
        run: |
          total=$(go tool cover -func=cover.out | awk '/^total:/ {sub("%","",$3); print $3}')
          echo "control-plane statement coverage: ${total}%" | tee -a "$GITHUB_STEP_SUMMARY"
          awk -v t="$total" 'BEGIN { exit !(t >= 80) }'
      - name: govulncheck (reachable Go vulnerabilities fail the build)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: npm audit (runtime dependencies, high and above)
        run: npm audit --omit=dev --audit-level=high
        working-directory: web

  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: LuaJIT syntax check (gateway modules)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq luajit
          for f in gateway/lua/corvus/*.lua gateway/redis/*.lua gateway/test/*.lua; do luajit -bl "$f" > /dev/null || exit 1; done
      - name: Lua unit tests (pure helpers)
        run: for f in gateway/test/*_test.lua; do luajit "$f" || exit 1; done

  # The image built from this source: integration checks against the dev stack
  # (deploy/dev/itest.sh), then an upgrade from the latest release on the same data volume.
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: corvus/gateway:ci
          cache-from: type=gha,scope=ci-integration
          cache-to: type=gha,scope=ci-integration,mode=max
      - name: Integration checks (dev stack, deploy/dev/itest.sh)
        run: deploy/dev/ci-itest.sh
        env: { CORVUS_IMAGE: "corvus/gateway:ci" }
      - name: Upgrade from the latest release (same data volume)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: deploy/dev/upgrade-test.sh "ghcr.io/${GITHUB_REPOSITORY_OWNER}/gateway:latest" corvus/gateway:ci
