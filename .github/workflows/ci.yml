# Build + tests + dependency vulnerability checks on every push / pull request.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - run: mkdir -p control/internal/webui/dist && touch control/internal/webui/dist/.gitkeep
      - run: go vet ./...
      - run: go test -race ./...
      - name: govulncheck (reachable Go vulnerabilities fail the build)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: npm audit (runtime dependencies, high and above)
        run: npm audit --omit=dev --audit-level=high
        working-directory: web

  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: LuaJIT syntax check (gateway modules)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq luajit
          for f in gateway/lua/corvus/*.lua gateway/redis/*.lua; do luajit -bl "$f" > /dev/null || exit 1; done
