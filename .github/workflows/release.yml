# Release: on a v* tag, build, test, publish and sign the image (build-image.yml). Run it
# manually (workflow_dispatch) to build and smoke-test without publishing.
#
# The work happens in the reusable workflow build-image.yml, isolated from this one: that is
# what makes the build provenance SLSA v1.0 Build Level 3.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  release:
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: write        # draft GitHub release with the SBOM and provenance files
      packages: write
      id-token: write        # keyless signing (Sigstore) and attestations
      attestations: write