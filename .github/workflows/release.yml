# Release: on a v* tag, build the image natively for amd64 and arm64, smoke-test each
# architecture, publish one multi-arch tag to GHCR, sign it (keyless cosign) and attach
# build provenance. The SBOMs, the provenance and signed checksums are also attached to a
# draft GitHub release, which is published by hand with the release notes. Run manually
# (workflow_dispatch) to build and smoke-test without publishing.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/gateway
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-24.04, arch: amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - id: ver
        run: |
          if [ "$PUBLISH" = "true" ]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-ci.${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (local, for the smoke test)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ steps.ver.outputs.version }}
          load: true
          tags: corvus:smoke
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,scope=release-${{ matrix.arch }},mode=max
      - name: Smoke test (gateway, admin console, embedded store)
        run: |
          mkdir -p data
          docker run -d --name smoke -p 18080:80 -p 19443:9443 -v "$PWD/data:/data" corvus:smoke
          for i in $(seq 1 60); do
            s=$(docker inspect -f '{{.State.Health.Status}}' smoke 2>/dev/null || true)
            [ "$s" = "healthy" ] && break
            sleep 2
          done
          docker logs smoke 2>&1 | grep -v setup_token | tail -20
          test "$(docker inspect -f '{{.State.Health.Status}}' smoke)" = "healthy"
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1:19443/)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/)" = "404"
          docker logs smoke 2>&1 | grep -q "embedded redis started"
          docker logs smoke 2>&1 | grep -q "setup_token"
          # every service process runs as corvus (the inspecting `ps` itself is excluded)
          procs=$(docker exec smoke ps -o user,args | tail -n +2 | grep -v " ps -o ")
          echo "$procs"
          test -z "$(echo "$procs" | awk '{print $1}' | grep -v -x corvus)"
          docker rm -f smoke
      - name: Smoke test (network_mode host, ports below 1024 without root, PUID/PGID)
        run: |
          mkdir -p data-host
          docker run -d --name smoke-host --network host -v "$PWD/data-host:/data" -e CORVUS_REDIS_PORT=6390 -e PUID=1500 -e PGID=1500 corvus:smoke
          for i in $(seq 1 60); do
            s=$(docker inspect -f '{{.State.Health.Status}}' smoke-host 2>/dev/null || true)
            [ "$s" = "healthy" ] && break
            sleep 2
          done
          docker logs smoke-host 2>&1 | grep -v setup_token | tail -20
          test "$(docker inspect -f '{{.State.Health.Status}}' smoke-host)" = "healthy"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/)" = "404"
          ! docker logs smoke-host 2>&1 | grep -q "Permission denied"
          test "$(stat -c %u:%g data-host)" = "1500:1500"
          procs=$(docker exec smoke-host ps -o user,args | tail -n +2 | grep -v " ps -o ")
          echo "$procs"
          test -z "$(echo "$procs" | awk '{print $1}' | grep -v -x 1500)"
          docker rm -f smoke-host
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push by digest
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Corvus AWPG
            org.opencontainers.image.description=Active Web Protection Gateway
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
      - name: Record digest
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p digests
          echo "${{ steps.push.outputs.digest }}" > "digests/${{ matrix.arch }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.PUBLISH == 'true'
        with:
          name: digest-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}
          retention-days: 1

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # draft GitHub release with the SBOM and provenance files
      packages: write
      id-token: write        # keyless signing (Sigstore) and attestations
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-arch tags
        id: manifest
        run: |
          v="${GITHUB_REF_NAME#v}"
          tags="-t ${IMAGE}:${v} -t ${IMAGE}:latest"
          case "$v" in *-*) tags="-t ${IMAGE}:${v}" ;; esac       # pre-releases do not move :latest
          major="${v%%.*}"; minor="${v#*.}"; minor="${major}.${minor%%.*}"
          case "$v" in *-*) ;; *) tags="$tags -t ${IMAGE}:${minor} -t ${IMAGE}:${major}" ;; esac
          docker buildx imagetools create $tags $(for f in digests/*; do echo "${IMAGE}@$(cat "$f")"; done)
          digest=$(docker buildx imagetools inspect "${IMAGE}:${v}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "${IMAGE}:${v}"
      # Keyless signing writes the repository identity to the public Sigstore log, and
      # artifact attestations need a public repository (or Enterprise).
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: ${{ !github.event.repository.private }}
      - name: Sign image (keyless)
        if: ${{ !github.event.repository.private }}
        run: cosign sign --yes "${IMAGE}@${{ steps.manifest.outputs.digest }}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        if: ${{ !github.event.repository.private }}
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
      # The same evidence as files on the GitHub release: SPDX SBOM per architecture (from
      # the image's BuildKit attestation), the provenance (in-toto envelope and the full
      # Sigstore bundle), the image digest, and SHA256SUMS signed keylessly.
      - name: Release files
        if: ${{ !github.event.repository.private }}
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          mkdir rel && cd rel
          for arch in amd64 arm64; do
            docker buildx imagetools inspect "${IMAGE}@${DIGEST}" \
              --format "{{ json (index .SBOM \"linux/${arch}\").SPDX }}" > "corvus-${v}-sbom-linux-${arch}.spdx.json"
            test "$(jq -r .spdxVersion "corvus-${v}-sbom-linux-${arch}.spdx.json")" != null
          done
          jq -c .dsseEnvelope "$BUNDLE" > "corvus-${v}.intoto.jsonl"
          cp "$BUNDLE" "corvus-${v}.provenance.sigstore.json"
          echo "${IMAGE}@${DIGEST}" > "corvus-${v}.image-digest.txt"
          sha256sum -- * > SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          ls -l
      - name: Draft GitHub release
        if: ${{ !github.event.repository.private }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" rel/* --clobber
          else
            pre=""; case "$tag" in *-*) pre="--prerelease" ;; esac
            gh release create "$tag" rel/* --draft $pre --verify-tag --title "$tag" \
              --notes "Release notes follow."
          fi
