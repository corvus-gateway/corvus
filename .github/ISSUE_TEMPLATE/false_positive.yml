name: Blocked by mistake (false positive)
description: A legitimate request was blocked by a security rule or signature
labels: [false-positive]
body:
  - type: textarea
    id: what
    attributes:
      label: What was blocked?
      description: |
        The rule or signature name from *Rule events* / *Events* helps a lot, plus an example of the request.
        Please remove cookies, tokens and personal data from the example.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "1.0.0"
