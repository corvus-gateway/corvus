<style>
  /* Modern but calm: soft neutral surface, rounded card, one accent colour. */
  :root {
    --bg: #f5f6f8; --dot: rgba(15,23,42,.07); --card: #ffffff; --fg: #0f172a; --muted: #5b6474; --subtle: #8a93a3;
    --line: #e7e9ee; --tile: #f6f7f9; --accent: #2563eb; --accent-soft: rgba(37,99,235,.10); --track: #eceef2;
    --ok: #16a34a; --ok-soft: rgba(22,163,74,.12); --warn: #b45309; --warn-soft: #fef6e7;
    --shadow: 0 1px 2px rgba(15,23,42,.04), 0 12px 32px -12px rgba(15,23,42,.16);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0d12; --dot: rgba(255,255,255,.05); --card: #14171d; --fg: #eef1f6; --muted: #a3abba; --subtle: #6f7787;
      --line: #232832; --tile: #1a1e26; --accent: #4f8cff; --accent-soft: rgba(79,140,255,.14); --track: #252a34;
      --ok: #34c06a; --ok-soft: rgba(52,192,106,.14); --warn: #f2b84b; --warn-soft: #251f12;
      --shadow: 0 0 0 1px rgba(255,255,255,.03), 0 18px 40px -18px rgba(0,0,0,.7); }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; color: var(--fg); overflow-wrap: anywhere; -webkit-font-smoothing: antialiased;
    font: 15px/1.55 "Pretendard Variable", Pretendard, system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic",
      "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    background: var(--bg); background-image: radial-gradient(var(--dot) 1px, transparent 1px); background-size: 22px 22px; }
  html:lang(ko) body { word-break: keep-all; }
  html:lang(zh) body, html:lang(ja) body { overflow-wrap: break-word; line-break: strict; }
  html:lang(zh) body { font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", system-ui, sans-serif; }
  html:lang(ja) body { font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo UI", "Meiryo", "Noto Sans CJK JP", "Noto Sans JP", system-ui, sans-serif; }
  .page { min-height: 100%; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; justify-content: flex-end; gap: 12px; padding: 18px clamp(16px, 4vw, 36px); }
  /* Language picker: native <select> (keyboard/screen-reader/mobile sheet for free) dressed as the pill. */
  .lang { position: relative; display: inline-flex; align-items: center; max-width: 100%; color: var(--subtle);
    border-radius: 10px; background: var(--card); border: 1px solid var(--line); transition: border-color .15s; }
  .lang:hover { border-color: var(--subtle); }
  .lang:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .lang svg { position: absolute; top: 50%; transform: translateY(-50%); pointer-events: none; }
  .lang .globe { left: 9px; }
  .lang .chev { right: 8px; }
  .lang select { -webkit-appearance: none; -moz-appearance: none; appearance: none; margin: 0; border: 0; border-radius: 9px; outline: none; cursor: pointer;
    min-width: 0; max-width: 100%; padding: 6px 26px 6px 29px; font-family: inherit; font-size: 12.5px; font-weight: 600; line-height: 1.4;
    color: var(--fg); background: var(--card); }
  .lang option { color: var(--fg); background: var(--card); }

  main { flex: 1; display: flex; justify-content: center; align-items: flex-start; padding: clamp(12px, 7vh, 72px) 16px 24px; }
  .wrap { width: 100%; max-width: 27.5rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden;
    animation: in .45s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .body { padding: 30px 30px 24px; }
  .status { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: var(--accent);
    background: var(--accent-soft); padding: 5px 10px; border-radius: 999px; margin-bottom: 16px; }
  .status i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: blink 1.6s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  .entering .status { color: var(--ok); background: var(--ok-soft); }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; line-height: 1.35; margin: 0 0 6px; }
  .lead { margin: 0 0 26px; color: var(--muted); font-size: 14.5px; }

  .pos { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .pos .k { font-size: 13px; font-weight: 600; color: var(--muted); padding-bottom: 6px; }
  .pos .v { font-size: 52px; font-weight: 750; line-height: 1; letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
  .pos .v small { font-size: 17px; font-weight: 600; letter-spacing: 0; color: var(--muted); margin-left: 4px; }
  .bar { position: relative; height: 8px; border-radius: 999px; background: var(--track); overflow: hidden; margin-bottom: 22px; }
  .bar > i { position: absolute; inset: 0 auto 0 0; width: 3%; border-radius: inherit; background: var(--accent); transition: width .9s cubic-bezier(.2,.7,.2,1); overflow: hidden; }
  .bar > i::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent); transform: translateX(-100%); animation: sweep 2.2s ease-in-out infinite; }
  @keyframes sweep { to { transform: translateX(100%); } }
  .entering .bar > i { background: var(--ok); }

  dl { margin: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  dl > div { background: var(--tile); border-radius: 12px; padding: 11px 12px; min-width: 0; }
  dt { font-size: 12px; color: var(--subtle); font-weight: 600; margin-bottom: 2px; }
  dd { margin: 0; font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  dd.dim { color: var(--subtle); font-weight: 500; font-size: 14px; }
  #eta { white-space: normal; overflow-wrap: break-word; line-height: 1.3; }
  dt, #eta { overflow-wrap: normal; -webkit-hyphens: auto; hyphens: auto; }
  .live { display: flex; align-items: center; gap: 6px; margin-top: 16px; font-size: 12.5px; color: var(--subtle); }
  .live b { font-weight: 500; }

  .band { display: flex; gap: 10px; align-items: flex-start; padding: 14px 30px; border-top: 1px solid var(--line); font-size: 13.5px; color: var(--muted); }
  .band svg { flex: none; margin-top: 2px; color: var(--subtle); }
  .band.warn { background: var(--warn-soft); color: var(--warn); }
  .band.warn svg { color: var(--warn); }
  .preview { margin: 0 0 12px; padding: 9px 14px; font-size: 13px; color: var(--warn); background: var(--warn-soft); border: 1px solid var(--line); border-radius: 12px; }
  footer { display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 12px; color: var(--subtle); padding: 14px 16px 22px; }
  footer svg { height: 13px; width: auto; }

  @media (max-width: 480px) {
    .body { padding: 24px 20px 20px; } .band { padding: 12px 20px; }
    .pos .v { font-size: 44px; } dl { gap: 6px; } dl > div { padding: 10px; } dd { font-size: 15px; }
  }
  @media (max-width: 360px) { dl > div { padding: 9px 8px; } dt { font-size: 11px; } dd { font-size: 14px; } }
  @media (prefers-reduced-motion: reduce) { .card, .status i, .bar > i::after { animation: none; } .bar > i { transition: none; } }
</style>

    try { fmtRel = new Intl.RelativeTimeFormat(l, { numeric: "auto", style: "short" }); } catch (e) { fmtRel = null; }
  }
  function minutes(m) { return fmtMin ? fmtMin.format(m) : fmt.format(m) + t("min"); }
  function etaText(m) { return m === null || m === undefined ? null : (m < 1 ? t("lessMin") : minutes(Math.ceil(m))); }
  var st = { entering: false, last: null, first: null, updated: 0, samples: [] };

  var picker = $("lang");
  function render() {
    formatters();
    document.documentElement.lang = loc();
    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"), function (el) { el.textContent = t(el.getAttribute("data-i18n")); });
    picker.value = lang; picker.setAttribute("aria-label", t("language") + (lang === "en" ? "" : " (Language)"));
    if (st.entering) { $("status").textContent = t("statusIn"); $("title").textContent = t("enterTitle"); $("lead").textContent = t("enterLead"); }
    document.title = st.entering ? t("enterTitle") : t("title");
    if (preview) { $("preview").hidden = false; $("preview").textContent = t("preview"); }
    if (st.last) show(st.last);
    tick();
  }
  picker.addEventListener("change", function () {
    var c = pick(picker.value); if (!c) return;
    lang = c; try { localStorage.setItem(KEY, c); } catch (e) {}
    render();
  });

  // Same-origin return path only (resolved exactly as the browser would follow it).
  var ret = "/";
  try { var u = new URL(params.get("r") || "/", location.origin); if (u.origin === location.origin) ret = u.pathname + u.search + u.hash; } catch (e) { ret = "/"; }
  var room = location.pathname.split("/").pop();

  // ETA only with evidence: at least 3 samples over 20 s with the line moving.
  function eta(rank) {
    var now = Date.now(), s = st.samples;
    s.push([now, rank]); while (s.length > 40) s.shift();
    var a = s[0];
    if (s.length < 3 || now - a[0] < 20000 || a[1] <= rank) return null;
    var perSec = (a[1] - rank) / ((now - a[0]) / 1000);
    if (perSec <= 0) return null;
    return rank / perSec / 60;   // minutes; formatted in show() so a language switch re-renders it
  }

  function show(s) {
    st.last = s;
    if (st.first === null || s.rank > st.first) st.first = s.rank;
    $("rank").textContent = fmt.format(Math.max(0, s.rank));
    $("ticket").textContent = s.ticket ? "#" + fmt.format(s.ticket) : "–";
    $("waiting").textContent = fmt.format(s.waiting || 0) + t("people");
    var e = etaText(s.etaMin);
    $("eta").textContent = e || t("calc");
    $("eta").className = e ? "" : "dim";
    var pct = st.entering ? 100 : (st.first > 0 ? Math.max(3, Math.min(100, (1 - (s.rank - 1) / st.first) * 100)) : 3);
    $("fill").style.width = pct + "%";
    $("bar").setAttribute("aria-valuenow", String(Math.round(pct)));
  }

  function tick() {
    if (!st.updated) return;
    var s = Math.round((Date.now() - st.updated) / 1000);
    $("updated").textContent = s < 3 ? t("now") : (fmtRel ? fmtRel.format(-s, "second") : fmt.format(s) + t("ago"));
  }
  setInterval(tick, 1000);

  function note(text, warn) { $("note").textContent = text; $("band").className = warn ? "band warn" : "band"; }

  function entering() {
    st.entering = true;
    $("card").classList.add("entering");
    render();
  }

  render();
  var timer = null, inflight = false;
  function schedule(fn, sec) { clearTimeout(timer); timer = setTimeout(fn, Math.max(1, sec) * 1000 * (0.8 + Math.random() * 0.4)); }

  if (preview) {
    var demo = { rank: 128, ticket: 1342, waiting: 692 };
    var step = function () {
      demo.rank = Math.max(0, demo.rank - (2 + Math.floor(Math.random() * 5)));
      demo.waiting = Math.max(demo.rank, demo.waiting - 3);
      demo.etaMin = demo.rank > 0 ? demo.rank / 4 / 60 : null;
      st.updated = Date.now();
      show(demo);
      if (demo.rank === 0) {
        entering();
        setTimeout(function () {
          st.entering = false; st.first = null; $("card").classList.remove("entering");
          demo = { rank: 128, ticket: 1342, waiting: 692 }; render(); setTimeout(step, 2000);
        }, 4000);
        return;
      }
      setTimeout(step, 2000);
    };
    st.updated = Date.now(); show(demo); setTimeout(step, 2000);
    return;
  }

  var backoff = 0;
  function poll() {
    if (inflight) return;
    inflight = true; clearTimeout(timer);
    fetch("/__corvus/wr/" + encodeURIComponent(room) + "/status", { credentials: "same-origin", cache: "no-store" })
      .then(function (r) {
        if (r.status === 429) { var e = new Error("busy"); e.busy = true; throw e; }
        if (!r.ok && r.status !== 503) throw new Error(String(r.status));
        return r.json();
      })
      .then(function (s) {
        inflight = false; backoff = 0; st.updated = Date.now(); note(t("keep"), false);
        if (s.status === "active") {
          show({ rank: 0, ticket: st.last ? st.last.ticket : 0, waiting: s.waiting || 0 }); entering();
          setTimeout(function () { location.replace(ret); }, 800); return;
        }
        if (s.status === "waiting") { if (!s.pending) { s.etaMin = eta(s.rank); show(s); } schedule(poll, s.poll || 5); return; }
        if (s.status === "full") note(t("busy"), true);
        schedule(poll, s.retry_after || 10);
      })
      .catch(function (e) {
        inflight = false; backoff = Math.min(60, backoff ? backoff * 2 : (e && e.busy ? 3 : 5));
        note(e && e.busy ? t("busy") : t("retry"), true);
        schedule(poll, backoff);
      });
  }
  // Browsers throttle timers in hidden tabs: check at once when the tab is shown again,
  // so a turn that came while the visitor looked elsewhere is claimed right away.
  document.addEventListener("visibilitychange", function () { if (!document.hidden) poll(); });
  poll();
})();
</script>
</body>
</html>
